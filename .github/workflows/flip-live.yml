name: Flip live feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flip-live
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull today's games
        run: |
          python pull_all.py feed_full.json $(TZ=America/New_York date +%Y%m%d)
          python compact.py feed_full.json feed.json 600000
          rm -f feed_full.json
      - name: Save feed.json
        run: |
          git config user.name "flip-bot"
          git config user.email "flip-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Live feed $(date -u +%H:%M)" && git push)
