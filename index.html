<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Flip: small moments, big swings. The plays that flipped the game, with the win-probability numbers to prove it.">
<title>Flip</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Barlow+Condensed:wght@600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: the app runs inside an iPhone 18 Pro frame (402x874pt screen, smaller Dynamic Island). Liquid Glass tab bar, sheets and banners float over a single scrolling column. On a real phone the frame drops away and the app goes full screen. */
:root{
  --bg:#050505; --stage:#000000; --panel:#0e0e0e; --panel2:#161616; --line:#262626; --fg:#ffffff; --mute:#9a9a9a; --dim:#5f5f5f;
  --go:#f5c542; --go-ink:#1a1300; --dump:#ff5b4f; --fame:#f5c542; --info:#f5c542;
  --glass:rgba(22,22,22,.74); --glass-hi:rgba(255,255,255,.16); --glass-brd:rgba(255,255,255,.11);
  --display:"Bricolage Grotesque","Arial Narrow",sans-serif;
  --body:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 600px at 50% 0%,rgba(245,197,66,.10),transparent 60%),var(--stage);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
a{color:var(--info);text-decoration:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- stage & device ---------- */
.stagewrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:16px}
.stage{position:relative;flex-shrink:0}
.device{position:absolute;left:0;top:0;width:430px;height:902px;transform-origin:top left;border-radius:72px;padding:5px;
  background:linear-gradient(150deg,#5a5f69 0%,#2a2d33 18%,#1a1c20 50%,#34373e 82%,#5b6069 100%);
  box-shadow:0 0 0 1px #0c0d10,0 40px 90px rgba(0,0,0,.65),0 0 120px rgba(245,197,66,.06)}
.device::before{content:"";position:absolute;inset:1.5px;border-radius:70px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.bezel{width:100%;height:100%;background:#000;border-radius:67px;padding:9px;overflow:clip}
.btn-side{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1c1e22,#4a4e56)}
.btn-side.l1{left:-3px;top:170px;height:34px}.btn-side.l2{left:-3px;top:230px;height:62px}.btn-side.l3{left:-3px;top:306px;height:62px}
.btn-side.r1{right:-3px;top:250px;height:96px;background:linear-gradient(270deg,#1c1e22,#4a4e56)}
.btn-side.r2{right:-3px;top:560px;height:70px;border-radius:3px;background:linear-gradient(270deg,#121316,#3a3d44)}
.caption{font-size:12px;color:var(--dim);text-align:center}
.caption b{color:var(--mute);font-weight:600}

.screen{position:relative;width:402px;height:874px;border-radius:58px;overflow:hidden;overflow:clip;background:var(--bg);isolation:isolate}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.statusbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 50px;pointer-events:none;font-weight:600;font-size:17px;letter-spacing:-.2px}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:45;width:98px;height:30px;border-radius:20px;background:#000;transition:width .45s cubic-bezier(.3,1.4,.5,1),height .45s cubic-bezier(.3,1.4,.5,1),border-radius .45s;display:flex;align-items:center;justify-content:space-between;padding:0 10px;overflow:hidden;color:#fff}
.island .ia{opacity:0;transition:opacity .2s;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:13px;font-weight:600;min-width:0}
.island img{width:22px;height:22px;border-radius:6px}
.island.open{width:268px;height:40px;border-radius:24px}
.island.open .ia{opacity:1;transition-delay:.18s}
.screen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(0deg,rgba(5,5,5,.95),rgba(5,5,5,0));pointer-events:none;z-index:34}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);z-index:46;pointer-events:none}

/* full-bleed on real phones */
body.bleed{overflow:hidden}
body.bleed .stagewrap{padding:0;display:block}
body.bleed .stage{position:fixed;inset:0;width:auto!important;height:auto!important}
body.bleed .device{position:absolute;inset:0;width:auto;height:auto;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important}
body.bleed .device::before,body.bleed .btn-side,body.bleed .caption,body.bleed .statusbar,body.bleed .homebar{display:none}
body.bleed .bezel{padding:0;border-radius:0}
body.bleed .screen{width:100%;height:100%;border-radius:0}
body.bleed .island{display:none}
body.bleed .navbar{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
body.bleed .tabdock,body.bleed .actionbar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}

/* ---------- glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.25),0 12px 34px rgba(0,0,0,.45)}

/* nav bar */
.navbar{position:sticky;top:0;z-index:30;padding:56px 16px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(5,5,5,.92) 0%,rgba(5,5,5,.72) 70%,rgba(5,5,5,0));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.navbar .l{justify-self:start;display:flex;align-items:center;min-width:0}
.navbar .c{font-weight:700;font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap}
.navbar.scrolled .c{opacity:1}
.navbar .r{justify-self:end}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.4px;line-height:1}
.brand b{color:var(--go)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13.5px}
.pill .dotg{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go)}
.backbtn{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:7px 12px 7px 8px;font-weight:600;font-size:15px;border:1px solid var(--glass-brd)}
.large{font-family:var(--body);font-weight:800;font-size:34px;letter-spacing:-.6px;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.lede{color:var(--mute);margin:0 0 14px;font-size:14px}
.page{padding:0 16px 130px}

h2,h3{margin:0;line-height:1.1}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute)}
.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--panel2);color:var(--fg)}
.btn.go{background:var(--go);color:var(--go-ink)}
.btn.dump{background:var(--dump);color:#1d0806}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.full{width:100%}

/* segmented (iOS) */
.segm{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:rgba(118,118,128,.18);margin-bottom:12px}
.segm button{border:0;background:none;border-radius:9px;padding:6px 0;font-size:13px;font-weight:600;color:var(--mute)}
.segm button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.seglabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}

/* flashes */
.flashes{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.flash{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;border:0;text-align:left;min-width:0;width:100%}
.flash .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash.buy{background:var(--go);color:var(--go-ink)}
.flash.sell{background:var(--dump);color:#1d0806}
.flash.launch{background:var(--fame);color:#1a1300}
.flash.pop{animation:shake .35s}
@keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(4px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}100%{transform:translateX(0)}}

/* king of the hill */
.koth{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;padding:12px;border-radius:22px;margin-bottom:16px;cursor:pointer;
  background:linear-gradient(135deg,rgba(245,197,66,.16),rgba(245,197,66,.03) 60%),var(--panel);border:1px solid rgba(245,197,66,.3)}
.koth img{width:92px;height:92px;border-radius:14px;display:block}
.koth .crown{color:var(--fame);font-size:9.5px}
.koth h2{font-family:var(--display);font-weight:800;font-size:24px;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.koth .stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
.koth .stats b{font-family:var(--mono);color:var(--fg)}

/* filters */
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{border-color:var(--go);color:var(--go);background:rgba(245,197,66,.08)}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.search{background:rgba(118,118,128,.18);border:0;border-radius:12px;padding:9px 12px;min-width:0;width:100%;font-size:14px}
.search::placeholder{color:var(--dim)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px;border-radius:18px;background:var(--panel);border:1px solid transparent;cursor:pointer;min-width:0}
.card img{width:78px;height:78px;border-radius:12px;display:block}
.card .ci{min-width:0;display:flex;flex-direction:column;gap:1px}
.card .row{display:flex;align-items:center;gap:6px;min-width:0}
.tk{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mcrow{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;margin-top:3px}
.card .mcrow b{font-family:var(--mono);color:var(--go)}
.card .bar{margin-top:4px}
.card.bump{animation:shake .35s;border-color:rgba(245,197,66,.55)}
.card.bump.s{border-color:rgba(255,91,79,.55)}
.card.mine{box-shadow:inset 0 0 0 1px rgba(245,197,66,.5)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase;padding:2px 6px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.tag.career{background:rgba(245,197,66,.16);color:var(--info)}
.tag.relic{background:rgba(255,91,79,.15);color:var(--dump)}
.tag.hof{background:rgba(245,197,66,.16);color:var(--fame)}
.tag.you{background:rgba(245,197,66,.14);color:var(--go)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:3px}
.bar.full i{background:var(--fame)}
.up{color:var(--go)} .down{color:var(--dump)}
.empty{padding:34px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:18px}

/* coin page */
.chead{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;margin:4px 0 10px}
.chead img{width:76px;height:76px;border-radius:16px}
.chead h1{font-family:var(--display);font-weight:900;font-size:32px;margin:0;line-height:1;letter-spacing:.3px}
.chead .nm{color:var(--mute);font-weight:600;font-size:14px;margin-top:2px}
.sub{color:var(--mute);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.moment{font-size:15px;margin:0 0 14px}
.panel{background:var(--panel);border-radius:22px;padding:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-bottom:10px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.kv b{font-family:var(--mono);font-size:15px}
.chartbox{height:230px}
.curvebox{height:150px}
.chartbox canvas,.curvebox canvas{width:100%;height:100%;display:block}
.note{font-size:12px;color:var(--mute)}
.hofbar .bar{height:9px;border-radius:5px}
.hofbar p{margin:8px 0 0;font-size:12.5px;color:var(--mute)}
.possum{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.possum b{font-family:var(--mono)}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:rgba(118,118,128,.18);margin-bottom:12px}
.subtabs button{border:0;background:none;border-radius:9px;padding:6px 0;font-size:13px;font-weight:600;color:var(--mute)}
.subtabs button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:600;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:5px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid rgba(38,38,38,.6);white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto;margin-inline:-4px}
.who{display:inline-flex;align-items:center;gap:6px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.persona{font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--mute);text-transform:uppercase}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:var(--panel2);border-radius:16px 16px 16px 6px;max-width:92%}
.msg.me{align-self:flex-end;background:rgba(245,197,66,.14);border-radius:16px 16px 6px 16px}
.msg .h{font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center}
.chatform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.rivals{display:flex;flex-direction:column;gap:6px}
.rival{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:14px;background:var(--panel2);border:0;text-align:left;width:100%}
.rival img{width:36px;height:36px;border-radius:9px}
.rival.cur{box-shadow:inset 0 0 0 1px var(--go)}

/* hall / tiles */
.plaques{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plaque{background:linear-gradient(180deg,rgba(245,197,66,.12),var(--panel) 70%);border:1px solid rgba(245,197,66,.28);border-radius:20px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.plaque img{width:100%;aspect-ratio:1;border-radius:14px;display:block;max-width:100%}
.plaque h3{font-family:var(--display);font-weight:800;font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plaque .meta{font-size:11px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:var(--panel);border-radius:18px;padding:12px 14px}
.tile span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.7px}
.tile b{display:block;font-family:var(--mono);font-size:18px;margin-top:2px}

/* tab dock (Liquid Glass) */
.tabdock{position:absolute;left:14px;right:14px;bottom:26px;z-index:35;display:flex;gap:10px;align-items:center;transition:transform .35s cubic-bezier(.3,1.2,.5,1),opacity .25s}
.tabdock.hide{transform:translateY(120px);opacity:0;pointer-events:none}
.tabbar{flex:1;display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:999px;height:64px}
.tabbar button{border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--go);background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.fab{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--go);border:1px solid var(--glass-brd)}
.fab svg{width:26px;height:26px}
.actionbar{position:absolute;left:14px;right:14px;bottom:26px;z-index:35;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:999px;transition:transform .35s cubic-bezier(.3,1.2,.5,1),opacity .25s}
.actionbar.hide{transform:translateY(120px);opacity:0;pointer-events:none}
.actionbar .btn{padding:14px}

/* sheets */
.modal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:calc(100% - 16px);margin:0 8px 8px;max-height:calc(100% - 64px);overflow-y:auto;border-radius:40px;padding:10px 18px 22px;background:rgba(22,25,35,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 40px rgba(0,0,0,.5);animation:up .38s cubic-bezier(.2,1.1,.4,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:0 auto 12px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheethead h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.x{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:32px;height:32px;flex-shrink:0;font-size:14px;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--mute)}
.input{background:rgba(118,118,128,.2);border:1px solid transparent;border-radius:14px;padding:11px 13px;width:100%;font-size:15px}
.input:focus{border-color:var(--go);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--mute)}
.opt[aria-pressed="true"]{border-color:var(--go);color:var(--fg);background:rgba(245,197,66,.08)}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.previewrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin-bottom:14px}
.previewrow canvas{width:120px;height:120px;border-radius:18px;display:block}
.hint{font-size:12px;color:var(--mute);line-height:1.45}
.hint b{color:var(--fg)}
.err{color:var(--dump);font-size:12.5px;min-height:16px;margin-bottom:6px}

/* banners (iOS notifications) */

@keyframes rise{to{transform:translateY(-80px);opacity:0}}

var drawProps=function(x,props,S,ox,oy,col,front){
  const P=(q)=>[ox+q[0]*S,oy+q[1]*S];
  for(const pr of props){if(!!pr.front!==front)continue;
    x.save();x.strokeStyle=col;x.fillStyle=col;x.lineCap="round";x.lineJoin="round";x.globalAlpha=pr.alpha??1;
    if(pr.t==="ball"){x.shadowColor=col;x.shadowBlur=S*5;x.beginPath();x.arc(...P([pr.x,pr.y]),pr.r*S,0,7);x.fill()}
    else if(pr.t==="line"){x.lineWidth=pr.w*S;x.beginPath();x.moveTo(...P(pr.a));x.lineTo(...P(pr.b));x.stroke()}
    else if(pr.t==="dash"){x.lineWidth=1.8*S;x.setLineDash([3*S,3*S]);x.globalAlpha=.8;x.beginPath();pr.pts.forEach((q,i)=>i?x.lineTo(...P(q)):x.moveTo(...P(q)));x.stroke()}
    else if(pr.t==="ell"){x.beginPath();x.ellipse(...P([pr.x,pr.y]),pr.rx*S,pr.ry*S,pr.rot,0,7);if(pr.stroke){x.lineWidth=1.8*S;x.stroke()}else x.fill()}
    else if(pr.t==="net"){x.lineWidth=1.2*S;x.globalAlpha=.75;for(let i=0;i<=3;i++){x.beginPath();x.moveTo(...P([pr.x+i*pr.w/3,pr.y]));x.lineTo(...P([pr.x+pr.w*.2+i*pr.w*.2,pr.y+pr.h]));x.stroke()}x.beginPath();x.moveTo(...P([pr.x+pr.w*.1,pr.y+pr.h*.5]));x.lineTo(...P([pr.x+pr.w*.9,pr.y+pr.h*.5]));x.stroke()}
    else if(pr.t==="goal"){x.lineWidth=2.5*S;x.beginPath();x.moveTo(...P([pr.x,90]));x.lineTo(...P([pr.x,pr.y]));x.lineTo(...P([100,pr.y]));x.stroke();x.lineWidth=.8*S;x.globalAlpha=.5;for(let i=1;i<5;i++){x.beginPath();x.moveTo(...P([pr.x+i*(100-pr.x)/5,pr.y]));x.lineTo(...P([pr.x+i*(100-pr.x)/5,90]));x.stroke();x.beginPath();x.moveTo(...P([pr.x,pr.y+i*(90-pr.y)/5]));x.lineTo(...P([100,pr.y+i*(90-pr.y)/5]));x.stroke()}}
    else if(pr.t==="spark"){x.lineWidth=2.2*S;for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r1=pr.r*.35*S,r2=pr.r*(i%2?.7:1)*S,[cx,cy]=P([pr.x,pr.y]);x.beginPath();x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);x.stroke()}}
    else if(pr.t==="wave"){x.lineWidth=2.4*S;x.beginPath();for(let i=0;i<=100;i+=2){const q=P([i,pr.y+Math.sin(i/5)*2]);i?x.lineTo(...q):x.moveTo(...q)}x.stroke();x.globalAlpha=.25;x.lineTo(...P([100,100]));x.lineTo(...P([0,100]));x.closePath();x.fill()}
    else if(pr.t==="ground"){x.lineWidth=1.6*S;x.globalAlpha=.45;x.beginPath();x.moveTo(ox-60*S,oy+pr.y*S);x.lineTo(ox+160*S,oy+pr.y*S);x.stroke()}
    else if(pr.t==="fallen"){x.lineWidth=6*S;x.globalAlpha=.55;const[cx,cy]=P([pr.x,pr.y]);x.beginPath();x.moveTo(cx-12*S,cy);x.lineTo(cx+8*S,cy-2*S);x.stroke();x.beginPath();x.arc(cx+13*S,cy-4*S,4.5*S,0,7);x.fill()}

function drawFig(x,f,S,ox,oy,col,glow){
  const P=(q)=>[ox+q[0]*S,oy+q[1]*S];const sh=[f.n[0]+(f.p[0]-f.n[0])*.15,f.n[1]+(f.p[1]-f.n[1])*.15];
  x.save();x.strokeStyle=col;x.fillStyle=col;x.lineCap="round";x.lineJoin="round";x.shadowColor=glow;x.shadowBlur=S*6;if(f.ghost){x.globalAlpha=.5;x.shadowBlur=0}
  const path=(pts,w)=>{x.lineWidth=w*S;x.beginPath();pts.forEach((q,i)=>i?x.lineTo(...P(q)):x.moveTo(...P(q)));x.stroke()};
  path([f.n,f.p],10.5);path([sh,f.le,f.lh],7);path([sh,f.re,f.rh],7);path([f.p,f.lk,f.lf],8);path([f.p,f.rk,f.rf],8);
  x.beginPath();x.arc(...P(f.h),6.8*S,0,7);x.fill();x.restore();
}
function drawBackdrop(x,c,w,h,p){
  x.fillStyle=p.bg;x.fillRect(0,0,w,h);const s=Math.max(w,h);
  x.save();x.globalAlpha=.1;x.fillStyle=p.fg;x.strokeStyle=p.fg;
  if(c.pat==="rays"){const n=22;for(let i=0;i<n;i+=2){const a0=Math.PI+(i/n)*Math.PI,a1=Math.PI+((i+1)/n)*Math.PI;x.beginPath();x.moveTo(w/2,h*1.05);x.arc(w/2,h*1.05,s*1.4,a0,a1);x.closePath();x.fill()}}
  else if(c.pat==="halftone"){x.globalAlpha=.2;const g=s/22;for(let yy=0;yy<=h/g;yy++)for(let xx=0;xx<=w/g;xx++){const r=(xx*g/w+yy*g/h)/2*g*.45+.5;x.beginPath();x.arc(xx*g,yy*g,r,0,7);x.fill()}}
  else if(c.pat==="stripes"){x.lineWidth=s/18;for(let i=-s;i<s*2;i+=s/7){x.beginPath();x.moveTo(i,0);x.lineTo(i-h,h);x.stroke()}}
  else if(c.pat==="court"){x.globalAlpha=.16;x.lineWidth=s/160;x.strokeRect(w*.05,h*.06,w*.9,h*.88);x.beginPath();x.moveTo(w/2,h*.06);x.lineTo(w/2,h*.94);x.stroke();x.beginPath();x.arc(w/2,h/2,Math.min(w,h)*.16,0,7);x.stroke()}
  else{x.lineWidth=s/60;for(let r=s*.06;r<s*1.3;r+=s/12){x.beginPath();x.arc(w*.5,h*.45,r,0,7);x.stroke()}}
  x.restore();
  const rg=x.createRadialGradient(w*.5,h*.48,0,w*.5,h*.48,Math.min(w,h)*.62);rg.addColorStop(0,p.fg+"55");rg.addColorStop(1,p.fg+"00");x.fillStyle=rg;x.fillRect(0,0,w,h);
  const vg=x.createLinearGradient(0,0,0,h);vg.addColorStop(0,"rgba(0,0,0,.25)");vg.addColorStop(.5,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");x.fillStyle=vg;x.fillRect(0,0,w,h);
}
function drawArt(cv,c,w=320,h=320,opts={}){
  cv.width=w;cv.height=h;const x=cv.getContext("2d");const p=PALS[c.pal]||PALS.flood;
  drawBackdrop(x,c,w,h,p);
  const play=PLAYS[c.play]||PLAYS[SPORT_PLAY[c.sport]]||PLAYS.celebrate;
  const box=Math.min(w,h)*(opts.fig||.78),S=box/100,ox=(w-box)/2,oy=(h-box)/2+box*.03;
  drawProps(x,play.props,S,ox,oy,p.fg,false);
  play.figs.forEach(f=>drawFig(x,f,S,ox,oy,p.hi,p.fg));
  drawProps(x,play.props,S,ox,oy,p.fg,true);
  if(opts.labels){x.font=`700 ${Math.round(h*.045)}px "Geist Mono", monospace`;x.fillStyle=p.fg;x.globalAlpha=.9;x.textBaseline="alphabetic";x.textAlign="right";x.fillText("CLUTCH",w-h*.05,h*.09)}
}

  const W=Math.round(w*d),H=Math.round(h*d);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}const x=cv.getContext("2d");x.setTransform(d,0,0,d,0,0);return{x,w,h}}

function toast(title,html,kind=""){

  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),320)},3800);
}

function scaleDevice(){

const _drawProps=drawProps;
drawProps=function(x,props,S,ox,oy,col,front){
  _drawProps(x,props.filter(p=>p.t!=="cloth"&&p.t!=="board"),S,ox,oy,col,front);
  if(front)return;const P=q=>[ox+q[0]*S,oy+q[1]*S];
  props.forEach(pr=>{x.save();
    if(pr.t==="cloth"){const[cx,cy]=P([pr.x,pr.y]);x.translate(cx,cy);x.rotate(-.5);x.fillStyle=pr.color;x.shadowColor=pr.color;x.shadowBlur=S*6;x.fillRect(-6*S,-4*S,12*S,8*S)}
    if(pr.t==="board"){const[bx,by]=P([pr.x,pr.y]);x.fillStyle="#0a0a0a";x.strokeStyle=col;x.lineWidth=1.6*S;x.fillRect(bx,by,16*S,10*S);x.strokeRect(bx,by,16*S,10*S);x.fillStyle="#ff5b4f";x.beginPath();x.moveTo(bx+3*S,by+4*S);x.lineTo(bx+6*S,by+2*S);x.lineTo(bx+9*S,by+4*S);x.fill();x.fillStyle="#f5c542";x.beginPath();x.moveTo(bx+7*S,by+6*S);x.lineTo(bx+10*S,by+8*S);x.lineTo(bx+13*S,by+6*S);x.fill()}
    x.restore()});
};

/* ---------- state ---------- */
const SAVE_KEY="theflip-v1";
let S={rated:{},submitted:[],crowd:{},picks:{}};
const UI={view:"feed",gameId:null,top:"big",sport:"All"};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(r){const s=JSON.parse(r);if(s&&s.rated)S=Object.assign(S,s)}}catch(e){}}
const allMoments=()=>MOMENTS.concat(typeof FINALS!=="undefined"?officialMoments().filter(m=>!m.id.startsWith("m_")):[],S.submitted.filter(m=>m.live));
const mById=id=>allMoments().find(m=>m.id===id);
function dist(m){return S.crowd[m.id]||(S.crowd[m.id]=m.seed.slice())}
function crowdScore(m){const d=dist(m);let n=0,t=0;d.forEach((c,i)=>{n+=c;t+=c*i});return n?t/n:0}
function votes(m){return dist(m).reduce((a,b)=>a+b,0)}
function disputed(m){const d=dist(m),n=votes(m),mu=crowdScore(m);let v=0;d.forEach((c,i)=>v+=c*(i-mu)**2);return Math.sqrt(v/n)}
function swing(m){return m.after-m.before}
const verdictWord=s=>s>=8?"Game changer":s>=6?"Swung it":s>=4?"Mattered a bit":"Didn't matter";
/* the ONE fan number: % of fans who say it flipped the game (votes 6-10 on the old scale count as yes) */
const kfmt=n=>n>=1e4?Math.round(n/1e3)+"K":n>=1e3?(n/1e3).toFixed(1)+"K":String(n);
function fanPct(m){const d=dist(m);let n=0,y=0;d.forEach((c,i)=>{n+=c;if(i>=6)y+=c});return n?Math.round(y/n*100):0}
const fanTxt=(p,n)=>`${p}% agree · ${kfmt(n)} votes`;

/* ---------- art ---------- */
const artCache=new Map();
function art(m,kind){const key=m.id+kind;if(!artCache.has(key)){const cv=document.createElement("canvas");const c={pal:m.pal,pat:m.cat==="Flag"?"rays":m.cat==="Sub"?"rings":m.cat==="Rule"?"court":"halftone",play:m.play,sport:m.sport};
  if(kind==="tall")drawArt(cv,c,600,1100,{fig:.95});else if(kind==="wide")drawArt(cv,c,720,420,{fig:.9});else drawArt(cv,c,240,240,{fig:.82});artCache.set(key,cv.toDataURL("image/jpeg",.85))}return artCache.get(key)}

/* ---------- shared pieces ---------- */
function sbPill(m){const g=m.game;return`<div class="sb">${g.as!==""?`<span class="team">${esc(g.a)}</span><span class="sc">${esc(g.as)}</span><span class="dashx">–</span><span class="sc">${esc(g.bs)}</span><span class="team">${esc(g.b)}</span>`:`<span class="team">${esc(g.a)} vs ${esc(g.b)}</span>`}<span class="clk">${esc(m.clock)}</span></div>`}
function swingHTML(m,big){const sw=swing(m);const up=sw>=0;
  return`<div class="swing ${big?"big":""}"><div class="swl"><span class="eyebrow">Est. ${esc(m.team)} win chance</span><div class="swrow"><b class="num">${m.before}%</b><svg width="34" height="14" viewBox="0 0 34 14"><path d="M2 7h26M22 2l6 5-6 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><b class="num ${up?"up":"down"}">${m.after}%</b></div>${m.alt!=null?`<span class="note">If it had gone out: ~${m.alt}%</span>`:""}</div><div class="swr ${up?"up":"down"}"><b class="num">${up?"+":"−"}${Math.abs(sw)}</b><span>pt swing</span></div></div>`}
function histHTML(m,mine){const d=dist(m),mx=Math.max(...d);return`<div class="hist">${d.map((c,i)=>`<i style="height:${Math.max(4,c/mx*100)}%" class="${mine===i?"me":""}" title="${i}: ${c} votes"></i>`).join("")}</div><div class="histx"><span>0 · didn't matter</span><span>10 · changed everything</span></div>`}
function rateHTML(m){const r=S.rated[m.id];
  if(r==null)return`<div class="rate2 yn" data-mid="${m.id}"><span class="r2q">Did it flip the game?</span><button class="r2yn" data-yn="1" data-mid="${m.id}">It flipped it</button><button class="r2yn ghost" data-yn="0" data-mid="${m.id}">Not really</button></div>`;
  const p=fanPct(m);return`<div class="rated2"><span class="r2f"><b class="num">${p}%</b> agree</span><span class="r2n">${kfmt(votes(m))} votes · you: ${r>=6?"flipped it":"not really"} · <button class="r2undo" data-unrate="${m.id}">undo</button></span><button class="r2a" data-share="${m.id}">Share</button><button class="r2a ghost" data-game="${m.id}">Game</button></div>`}
function wireRate(root){
  root.querySelectorAll(".rate").forEach(el=>{const inp=el.querySelector("input");const upd=()=>{el.querySelector("[data-rv]").textContent=inp.value;el.querySelector("[data-rl]").textContent=verdictWord(+inp.value)};inp.oninput=upd});
}
document.addEventListener("click",e=>{
  const yn=e.target.closest("[data-yn]");if(yn){const m=mById(yn.dataset.mid);const v=yn.dataset.yn==="1"?10:0;S.rated[m.id]=v;dist(m)[v]++;save();const host=yn.closest(".rate2");host.outerHTML=rateHTML(m);refreshCounts();return}
  const un=e.target.closest("[data-unrate]");if(un){const m=mById(un.dataset.unrate);const v=S.rated[m.id];if(v!=null){dist(m)[v]=Math.max(0,dist(m)[v]-1);delete S.rated[m.id];save()}const host=un.closest(".rated2");host.outerHTML=rateHTML(m);refreshCounts();return}
  const mo=e.target.closest("[data-more]");if(mo){mo.classList.toggle("open");return}
  const l=e.target.closest("[data-lock]");if(l){const m=mById(l.dataset.lock);const v=+$("#r_"+m.id).value;S.rated[m.id]=v;dist(m)[v]++;save();const host=l.closest(".rate,.rate2");host.outerHTML=rateHTML(m);toast("Call locked",`You said ${v}/10. Fans say ${crowdScore(m).toFixed(1)}.`);refreshCounts();return}
  const s=e.target.closest("[data-share]");if(s){openShare(mById(s.dataset.share));return}
  const g=e.target.closest("[data-game]");if(g){openGame(mById(g.dataset.game).id);return}
  const o=e.target.closest("[data-openm]");if(o){openMoment(o.dataset.openm);return}
},true);

/* ---------- views ---------- */
const main=$("#main"),scroller=$("#scroller");
function setView(v,arg){UI.view=v;if(arg)UI.gameId=arg;
  const tabV={game:"games",live:"games",final:"games",real:"games"}[v]||v;document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.v===tabV)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  scroller.classList.toggle("snap",v==="feed");$("#screen").classList.toggle("reelmode",v==="feed");
  $("#reelHead").hidden=v!=="feed";closeModal();build();scroller.scrollTop=0}
function build(){({feed:buildFeed,games:buildGames,game:buildGame,top:buildTop,live:buildLive,final:buildFinal,real:buildReal}[UI.view]||buildFeed)()}
function refreshCounts(){const n=allMoments().filter(m=>S.rated[m.id]==null).length;const el=$("#headCount");if(el)el.textContent=`${n} to call`}

/* feed: full-screen reels */
function stepChart(m){const W=360,H=220,b=m.before,a=m.after,Y=v=>14+(1-v/100)*(H-28),fx=W*.62;const up=a>=b;
  const pre=`M0 ${Y(b+(m.id.length%7-3))} C ${W*.2} ${Y(b-4)}, ${W*.35} ${Y(b+5)}, ${W*.5} ${Y(b+2)} S ${fx-20} ${Y(b-1)}, ${fx} ${Y(b)}`;
  const post=`M${fx} ${Y(b)} L${fx} ${Y(a)} C ${fx+40} ${Y(a+(up?-2:2))}, ${W*.85} ${Y(a)}, ${W} ${Y(a)}`;
  return`<svg class="rstep" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="rw${m.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5c542" stop-opacity=".22"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></linearGradient></defs>
   <line x1="0" x2="${W}" y1="${Y(50)}" y2="${Y(50)}" stroke="#222" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
   <path d="${post} L${W} ${H} L${fx} ${H} Z" fill="url(#rw${m.id})"/>
   <path d="${pre}" fill="none" stroke="#4a4a4a" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
   <path d="${post}" fill="none" stroke="#f5c542" stroke-width="2.6" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 6px rgba(245,197,66,.7))"/></svg>`}
function reel(m){const sw=swing(m);
  return`<section class="reel r2" data-mid="${m.id}">
    <div class="r2bg">${stepChart(m)}${(()=>{const yb=(14+(1-m.before/100)*192)/220*100,ya=(14+(1-m.after/100)*192)/220*100;const mid=(yb+ya)/2;return`<div class="r2ann" style="left:62%;top:${mid}%"><span class="r2ac">${esc(m.clock)}</span><span class="r2av">${esc(m.verdict)}</span></div>`})()}</div>
    <div class="r2hero"><span class="r2big ${sw<0?"dn":""}">${sw>=0?"+":"−"}${Math.abs(sw)}</span><span class="r2wp">Est. ${esc(m.team)} win chance <b>${m.before}%</b> → <b class="${sw<0?"dn":"up"}">${m.after}%</b></span></div>
    <div class="r2body">
      <div class="r2meta"><span class="r2cat">${esc(m.cat)}</span><span>${esc(m.league)} · ${esc(m.date)}</span>${isOfficial(m)?`<span class="r2off">Official flip</span>`:""}</div>
      <h2 class="r2hl">${esc(m.headline)}</h2>
      <p class="r2line" data-more>${esc(m.line)}</p>
      <div class="r2src"><span>${(()=>{const g=m.game;return g.as!==""?`${esc(g.a)} ${esc(g.as)}–${esc(g.bs)} ${esc(g.b)} · ${esc(m.clock)}`:`${esc(g.a)} vs ${esc(g.b)} · ${esc(m.clock)}`})()}</span><a href="${esc(m.source.url)}" target="_blank" rel="noopener noreferrer">${esc(m.source.name)} ↗</a></div>
      ${rateHTML(m)}
    </div>
  </section>`}
function feedOrder(){return allMoments().slice().sort((a,b)=>(S.rated[a.id]!=null)-(S.rated[b.id]!=null)||Math.abs(swing(b))-Math.abs(swing(a)))}
function buildFeed(){
  $("#reelHead").innerHTML=`<div class="reelhead"><span class="rtabs"><span class="brand2"><b>flip</b></span><span class="note" id="headCount"></span></span><button class="pill glass" id="howBtn" style="pointer-events:auto">How it works</button></div>`;
  $("#howBtn").onclick=onboard;
  main.innerHTML=`<div class="reels">${feedOrder().map(reel).join("")}<section class="reel divider"><div class="rdiv"><div class="eyebrow">You're caught up</div><h2 class="rhl">See every flip, ranked</h2><p class="rline">The biggest game changers, the most disputed calls, and the ones that didn't matter at all.</p><button class="btn go" onclick="">Open rankings</button></div></section></div>`;
  main.querySelector(".divider .btn").onclick=()=>setView("top");
  wireRate(main);refreshCounts();
}
/* games */
function gamesList(){const g={};allMoments().forEach(m=>{const k=m.game.a+m.game.b+m.date;(g[k]||(g[k]={key:k,ms:[],m0:m})).ms.push(m)});return Object.values(g)}
function navbar2(title,back){return`<div class="navbar" id="navbar"><div class="l">${back?`<button class="backbtn glass" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>${esc(back)}</button>`:`<span class="brand2"><b>flip</b></span>`}</div><div class="c">${esc(title)}</div><div class="r"></div></div>`}
function buildGame(){
  const m0=mById(UI.gameId);const ms=allMoments().filter(m=>m.game.a===m0.game.a&&m.game.b===m0.game.b&&m.date===m0.date);
  main.innerHTML=navbar2(m0.game.a+" vs "+m0.game.b,"Lounge")+`<div class="page">
    <div class="gleague" style="margin-top:4px">${esc(m0.league)} · ${esc(m0.date)}</div>
    <h1 class="large" style="font-size:30px">${esc(m0.game.res)}</h1>
    <div style="margin:4px 0 14px">${sbPill(m0)}</div>
    ${(dg=>dg?`<button class="deckbtn" id="gDeck" style="margin:0 0 12px"><span class="dkplay"><svg width="10" height="12" viewBox="0 0 10 12"><path d="M1 1l8 5-8 5z" fill="currentColor"/></svg></span><span class="dkt"><b>Watch the flips</b><span>${dg.moments.length} moment${dg.moments.length>1?"s":""} · swipe through the game</span></span>${(m=>m?`<span class="dksw">${sgn(m.after-m.before)}</span>`:"")(topSwingMoment(dg))}</button>`:"")(momentGame(m0.id))}
    <div class="panel"><div class="eyebrow" style="margin-bottom:6px">Est. ${esc(m0.team)} win chance through the game</div><div class="wpbox"><canvas id="wp" aria-label="Win probability chart"></canvas></div><p class="note" style="margin:8px 0 0">Illustrative curve built around the flagged moments. The real product would use a live data feed.</p></div>
    <div class="eyebrow" style="margin:16px 0 8px">Turning points in this game</div>
    <div class="list">${ms.map(m=>`<button class="tcard" data-openm="${m.id}"><span class="catpill c-${m.cat.replace(/[^a-z]/gi,"").toLowerCase()}">${esc(m.cat.toUpperCase())}</span><b>${esc(m.headline)}</b><span class="note">${esc(m.clock)} · ${m.before}% → ${m.after}% · ${fanPct(m)}% agree</span></button>`).join("")}</div>
  </div>`;
  $("#back").onclick=()=>setView("games");{const gd=$("#gDeck");if(gd)gd.onclick=()=>openDeck(momentGame(m0.id))}
  requestAnimationFrame(()=>drawWP($("#wp"),ms));

/* ---------- chart ---------- */
function finalPath(g){if(g.rawPath)return g.rawPath;
  const an=g.path.slice();g.cands.forEach(c=>{an.push([c.x-.012,c.before]);an.push([c.x,c.after])});an.push([1,g.end]);an.sort((a,b)=>a[0]-b[0]);
  let sd=g.id.length*31;const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};const out=[an[0]];
  for(let i=1;i<an.length;i++){const[p,q]=[an[i-1],an[i]];const gap=q[0]-p[0];const n=gap<.015?1:Math.max(2,Math.round(gap*80));
    for(let k=1;k<=n;k++){const f=k/n;let v=p[1]+(q[1]-p[1])*f;if(k<n)v+=(r()-.5)*Math.min(9,gap*60);out.push([p[0]+gap*f,clamp(v,1,99)])}}return out}
function drawChart(cv,o){const{x,w,h}=fit(cv);const L=34,R=12,T=16,B=22,pw=w-L-R,ph=h-T-B;const XM=o.xmax||1,X=t=>L+t/XM*pw,Y=v=>T+(1-v/100)*ph;
  x.clearRect(0,0,w,h);x.font='10px "Geist Mono", monospace';x.fillStyle="#9a9a9a";x.textBaseline="middle";
  [0,50,100].forEach(v=>{x.strokeStyle="rgba(154,154,154,.15)";x.lineWidth=1;x.beginPath();x.moveTo(L,Y(v));x.lineTo(L+pw,Y(v));x.stroke();x.textAlign="right";x.fillText(v+"%",L-6,Y(v))});
  (o.ticks||[]).filter(t=>t[0]<XM-.02).forEach(([t,lab])=>{x.strokeStyle="rgba(154,154,154,.08)";x.beginPath();x.moveTo(X(t),T);x.lineTo(X(t),T+ph);x.stroke();x.fillStyle="#5f5f5f";x.textAlign="left";x.textBaseline="alphabetic";x.fillText(lab,X(t)+3,h-6)});
  const P=o.path;if(P.length>1){const fi=Math.max(1,flipIx(P).i);const seg=(a,b)=>{x.beginPath();for(let j=a;j<=b;j++){const[t,v]=P[j];j===a?x.moveTo(X(t),Y(v)):x.lineTo(X(t),Y(v))}};const last=P[P.length-1];
    seg(fi-1,P.length-1);x.lineTo(X(last[0]),Y(0));x.lineTo(X(P[fi-1][0]),Y(0));x.closePath();const gr=x.createLinearGradient(0,T,0,T+ph);gr.addColorStop(0,"rgba(245,197,66,.26)");gr.addColorStop(1,"rgba(245,197,66,0)");x.fillStyle=gr;x.fill();
    seg(0,fi-1);x.strokeStyle="#4d4d4d";x.lineWidth=1.6;x.lineJoin="round";x.lineCap="round";x.stroke();
    x.save();x.shadowColor="rgba(245,197,66,.8)";x.shadowBlur=10;seg(fi-1,P.length-1);x.strokeStyle="#f5c542";x.lineWidth=2.6;x.stroke();x.restore();
    x.fillStyle="#f5c542";x.strokeStyle="#050505";x.lineWidth=2;x.beginPath();x.arc(X(P[fi-1][0]),Y(P[fi-1][1]),4,0,7);x.fill();x.stroke();
    if(o.now!=null){const nx=X(last[0]),ny=Y(last[1]);x.fillStyle="rgba(245,197,66,.25)";x.beginPath();x.arc(nx,ny,9+3*Math.sin(Date.now()/180),0,7);x.fill();x.fillStyle="#f5c542";x.beginPath();x.arc(nx,ny,4,0,7);x.fill()}}
  (o.pins||[]).forEach(p=>{const px=X(p.x),py=Y(p.v);x.setLineDash([3,4]);x.strokeStyle=p.line||"rgba(255,91,79,.5)";x.lineWidth=1;x.beginPath();x.moveTo(px,T);x.lineTo(px,T+ph);x.stroke();x.setLineDash([]);
    if(p.ghost!=null){const gy=Y(p.ghost);x.setLineDash([2,3]);x.strokeStyle=p.fill;x.lineWidth=1.5;x.beginPath();x.moveTo(px,py);x.lineTo(px,gy);x.stroke();x.setLineDash([]);x.beginPath();x.arc(px,gy,p.r-1,0,7);x.stroke()}
    x.fillStyle=p.fill;x.strokeStyle="#050505";x.lineWidth=2;x.beginPath();x.arc(px,py,p.r,0,7);x.fill();x.stroke();if(p.ring){x.strokeStyle=p.fill;x.lineWidth=1.5;x.beginPath();x.arc(px,py,p.r+4,0,7);x.stroke()}
    if(p.txt){x.fillStyle=p.ink||"#050505";x.font=`700 ${p.r>9?11:9}px "Geist Mono", monospace`;x.textAlign="center";x.textBaseline="middle";x.fillText(p.txt,px,py+.5)}});
}

/* ---------- Floodlight Signature chart: grey until the flip, gold takeover after ---------- */
function flipIx(P){let i=-1,d=0;for(let j=1;j<P.length;j++){const dd=P[j][1]-P[j-1][1];if(Math.abs(dd)>Math.abs(d)){d=dd;i=j}}return{i,d}}
let SIGN=0;
function sigSVG(P,o){const W=o.W||340,H=o.H||120,pd=o.pad??8,u="sg"+(SIGN++);const XM=o.xmax||Math.max(1,...P.map(p=>p[0]));
  const X=t=>pd+t/XM*(W-2*pd),Y=v=>pd+(1-v/100)*(H-2*pd);const pts=P.map(([t,v])=>[X(t),Y(v)]);const L=a=>a.map(([x,y],j)=>(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)).join(" ");
  const{i}=flipIx(P);const head=pts[pts.length-1];
  let body=`<line x1="${pd}" x2="${W-pd}" y1="${Y(50)}" y2="${Y(50)}" stroke="#262626" stroke-dasharray="3 4"/>`;
  if(o.live&&head)body+=`<line x1="${head[0]}" x2="${head[0]}" y1="${pd}" y2="${H-pd}" stroke="#2c2c2c" stroke-dasharray="2 3"/>`;
  if(pts.length<2){body+=`<text x="${W/2}" y="${H/2-8}" text-anchor="middle" font-family="Geist Mono" font-size="10" fill="#666">${o.empty||"Waiting for the first play"}</text>`}
  else if(i<1){body+=`<path d="${L(pts)}" fill="none" stroke="#4d4d4d" stroke-width="${o.sw||1.5}"/>`}
  else{const pre=L(pts.slice(0,i)),post=L(pts.slice(i-1));const[fx,fy]=pts[i-1];
    body+=`<path d="${post} L${head[0]} ${Y(0)} L${fx} ${Y(0)} Z" fill="url(#w${u})"/><path d="${pre}" fill="none" stroke="#4d4d4d" stroke-width="${o.sw||1.5}" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${post}" fill="none" stroke="#f5c542" stroke-width="${(o.sw||1.5)*1.6}" stroke-linejoin="round" stroke-linecap="round" filter="url(#g${u})"/><circle cx="${fx}" cy="${fy}" r="${o.r||3.6}" fill="#f5c542" stroke="#0d0d0d" stroke-width="1.5"/>`}
  if(o.live&&head)body+=`<circle cx="${head[0]}" cy="${head[1]}" r="4" fill="#f5c542"><animate attributeName="r" values="4;12" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="${head[0]}" cy="${head[1]}" r="3.6" fill="#f5c542"/>`;
  return`<svg viewBox="0 0 ${W} ${H}" ${o.fixed?`width="${W}" height="${H}"`:""} style="overflow:visible" aria-hidden="true"><defs><linearGradient id="w${u}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5c542" stop-opacity=".26"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></linearGradient><filter id="g${u}" filterUnits="userSpaceOnUse" x="-40" y="-40" width="${W+80}" height="${H+80}"><feGaussianBlur stdDeviation="${o.glow||3}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${body}</svg>`}

    ${g.kind==="fb"?`<div class="flabel" style="margin-top:12px">What should the call have been?</div><div class="opts" id="dcPen">${PENS.map((p,i)=>`<button class="opt" data-v="${p[0]}" aria-pressed="${i===0}">${p[0]}</button>`).join("")}</div>`:""}</div>
   <div id="dcPrev" style="margin-top:12px"></div>
   <div class="field" style="margin-top:12px"><label for="fNote">Say it in one line</label><input class="input" id="fNote" maxlength="90" placeholder="No flag on the hold at the 30"></div>
   <button class="btn go full" id="fGo">Add deep cut</button></div>`);
  const paint=()=>{$("#dcCall").hidden=!CALLCATS.has(st.cat);[...$("#dcR").children].forEach(b=>b.classList.toggle("on",b.dataset.r===st.R));$("#dcPrev").innerHTML=impHTML(g,dcImpact(g,st.play,st.cat,st.R,st.pen))};
  const pick=(box,attr,fn)=>{$(box).onclick=e=>{const b=e.target.closest(`[${attr}]`);if(!b)return;[...$(box).children].forEach(z=>z.setAttribute("aria-pressed",z===b));fn(b.getAttribute(attr));paint()}};
  pick("#dcPlays","data-p",v=>{st.play=plays.find(p=>p.id===v);st.R=defR(st.play)});pick("#fCat","data-v",v=>st.cat=v);if($("#dcPen"))pick("#dcPen","data-v",v=>st.pen=v);
  $("#dcR").onclick=e=>{const b=e.target.closest("[data-r]");if(b){st.R=b.dataset.r;paint()}};paint();
  $("#fGo").onclick=()=>{const note=$("#fNote").value.trim();if(note.length<4){$("#fNote").focus();return}const id="p"+Date.now().toString(36);const im=dcImpact(g,st.play,st.cat,st.R,st.pen);closeModal();
    MYFLAGS=MYFLAGS.concat([{kind:"post",id,g:g.id,m:st.play.id,x:st.play.x,clock:st.play.c,cat:st.cat,note,imp:im,at:new Date().toISOString()}]);UI.rtab="fans";UI.open=id;toast("Deep cut added",im&&(im.type==="call"||im.n)?`${im.hid>=0?"+":"−"}${Math.abs(im.hid)} pt ${im.type==="call"?"hidden swing":"swing after"} for ${esc(im.R)}.`:"Its impact fills in over the next few plays.");saveMine()}}

function realFinal(g){return{id:g.id,real:true,sport:g.sport,league:g.league,date:"Tonight",a:g.a,as:g.as,b:g.b,bs:g.bs,res:`${g.as>g.bs?g.an:g.bn} win ${Math.max(g.as,g.bs)}–${Math.min(g.as,g.bs)}`,team:g.team,pal:"gold",ticks:g.ticks,rawPath:g.path,source:g.source,
  cands:g.moments.slice().sort((a,b)=>Math.abs(b.after-b.before)+(b.cat==="Big play"?0:8)-Math.abs(a.after-a.before)-(a.cat==="Big play"?0:8)).slice(0,5).sort((a,b)=>a.x-b.x).map(m=>({...m,votes:swingsOn(g.id,m.id)}))}}
function checkTrending(){S.nudged=S.nudged||{};const now=Date.now();
  const perMin=(g,mid,kinds)=>allItems().filter(f=>kinds.includes(f.kind||"swing")&&f.g===g.id&&f.m===mid&&now-Date.parse(f.at||0)<60000).length;
  for(const g of REAL){if(g.state!=="in")continue;const{ms,plays,posts}=itemsFor(g);
    for(const p of posts){if(p.mine||S.nudged[p.id]||myBack(g.id,p.id))continue;const b=backsOn(g.id,p.id);if(b.real<2)continue;
      if(nudge({gid:g.id,deep:true,cat:p.cat,game:`${g.a}–${g.b}`,clock:p.clock,title:p.t,stat:()=>{const x=backsOn(g.id,p.id);return{n:x.real+x.nah,perMin:perMin(g,p.id,["back"]),split:x.real+x.nah?Math.round(x.real/(x.real+x.nah)*100):null}},yes:"Real one",no:"Nah",
        onYes:()=>setBack(g,p,"real"),onNo:()=>setBack(g,p,"nah"),onOpen:()=>{UI.realId=g.id;UI.rtab="fans";UI.open=p.id;setView("real")}})){S.nudged[p.id]=1;save()}return}
    for(const it of ms.concat(plays)){if(S.nudged[it.id]||mySwing(g.id,it.id))continue;const recent=allItems().filter(f=>isSwing(f)&&f.g===g.id&&f.m===it.id&&now-Date.parse(f.at||0)<600000).length;if(recent<3)continue;
      if(nudge({gid:g.id,deep:false,cat:it.cat&&it.cat!=="Play"?it.cat:"Swing",game:`${g.a}–${g.b}`,clock:it.clock,title:it.t,stat:()=>({n:swingsOn(g.id,it.id),perMin:perMin(g,it.id,["swing"]),split:null}),yes:"Swung it",no:"Nah",onYes:()=>toggleSwing(g,it),onNo:()=>{},onOpen:()=>{UI.realId=g.id;UI.rtab="tp";UI.open=it.id;setView("real")}})){S.nudged[it.id]=1;save()}return}}}
async function initRealData(){try{S.realFlags=S.realFlags||[];MYFLAGS=S.realFlags;
  if(!(window.claude&&window.claude.use))return;const db=await window.claude.use("db");if(!db)return;DB=db;
  const user=await window.claude.use("user").catch(()=>null);UID=user?await user.id().catch(()=>null):null;
  db.doc("live/feed").onSnapshot(s=>{if(!s.exists)return;const d=s.data();if(!d||!Array.isArray(d.games))return;if(d.updatedAt&&REAL_AT&&Date.parse(d.updatedAt)<Date.parse(REAL_AT))return;REAL=d.games;REAL_AT=d.updatedAt;checkLeaders();rePaintReal()},()=>{});
  db.collection("flags").onSnapshot(q=>{FLAGS=q.docs.flatMap(d=>{const it=(d.data()||{}).items;return Array.isArray(it)?it.map(f=>({...f,_o:d.id})):[]});setTimeout(checkTrending,50);
    if(UID){const mine=q.docs.find(d=>d.id===UID);if(mine&&Array.isArray((mine.data()||{}).items))MYFLAGS=mine.data().items.slice()}rePaintReal()},()=>{});
 }catch(e){}}

/* top */
function buildTop(){
  const tabs=[["big","Biggest flips"],["disputed","Most disputed"],["nah","Didn't matter"]];
  let l=allMoments().slice();if(UI.top==="big")l.sort((a,b)=>fanPct(b)-fanPct(a)||Math.abs(swing(b))-Math.abs(swing(a)));else if(UI.top==="disputed")l.sort((a,b)=>Math.abs(fanPct(a)-50)-Math.abs(fanPct(b)-50));else l.sort((a,b)=>fanPct(a)-fanPct(b));
  const ratedN=Object.keys(S.rated).length;const close=Object.entries(S.rated).filter(([id,v])=>{const m=mById(id);return m&&((v>=6)===(fanPct(m)>=50))}).length;
  main.innerHTML=navbar2("Rankings")+`<div class="page"><h1 class="large">Rankings</h1><p class="lede">This week's turning points, ranked by the fans who called them.</p>
    <div class="segm" id="topTabs">${tabs.map(([k,t])=>`<button data-t="${k}" aria-pressed="${UI.top===k}">${t}</button>`).join("")}</div>
    <div class="list">${l.map((m,i)=>`<button class="rk" data-openm="${m.id}"><span class="rkn num">${i+1}</span><span class="rksw ${swing(m)<0?"dn":""}">${swing(m)>=0?"+":"−"}${Math.abs(swing(m))}</span><span class="rkmid"><span class="prow"><span class="catpill c-${m.cat.replace(/[^a-z]/gi,"").toLowerCase()}">${esc(m.cat.toUpperCase())}</span>${isOfficial(m)?`<span class="offtag">OFFICIAL FLIP</span>`:""}</span><b>${esc(m.headline)}</b><span class="note">${esc(m.league)} · ${esc(m.game.res)}</span></span><span class="rkr"><b class="num">${fanPct(m)}%</b><span>${UI.top==="disputed"?`split ${fanPct(m)}/${100-fanPct(m)}`:`agree · ${kfmt(votes(m))}`}</span></span></button>`).join("")}</div>
    <div class="you"><span class="eyebrow">Your calls</span><span>${ratedN} called · ${close} with the majority</span></div></div>`;
  $("#topTabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b){UI.top=b.dataset.t;buildTop()}};
}
/* moment sheet (from games/top) */
function openMoment(id){const m=mById(id);if(!m)return;
  modal(`<div class="sheet"><div class="grab"></div><div class="sheethead"><div><span class="catpill c-${m.cat.replace(/[^a-z]/gi,"").toLowerCase()}">${esc(m.cat.toUpperCase())}</span><div class="note" style="margin-top:4px">${esc(m.league)} · ${esc(m.date)}</div></div><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="mart"><img alt="" src="${art(m,"wide")}"><div class="sb-over">${sbPill(m)}</div></div>
  <h2 class="mh">${esc(m.headline)}</h2><p class="note" style="font-size:13.5px;color:#cfcfcf">${esc(m.line)}</p>
  <div class="vrow"><span class="verdict">${esc(m.verdict)}</span><a href="${esc(m.source.url)}" target="_blank" rel="noopener noreferrer">${esc(m.source.name)} ↗</a></div>
  ${swingHTML(m,true)}${rateHTML(m)}</div>`);wireRate($("#modal"));
}
/* submit */
function openSubmit(){
  const cats=["Missed call","Flag","Rule","Sub","Argument","Technical","Injury exit","Other"];
  modal(`<div class="sheet"><div class="grab"></div><div class="sheethead"><div><div class="eyebrow">Spot a turning point</div><h2>Add a moment</h2></div><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="field"><label for="sGame">Game</label><input class="input" id="sGame" placeholder="Rams vs Broncos"></div>
  <div class="two"><div class="field"><label for="sClock">When</label><input class="input" id="sClock" placeholder="Q4 · 1:09"></div><div class="field"><label for="sSport">Sport</label><select class="input" id="sSport">${["Football","Basketball","Soccer","Baseball","Hockey","Other"].map(s=>`<option>${s}</option>`).join("")}</select></div></div>
  <div class="field"><span class="flabel">What kind of moment?</span><div class="opts" id="sCat">${cats.map((c,i)=>`<button class="opt" data-v="${c}" aria-pressed="${i===0}">${c}</button>`).join("")}</div></div>
  <div class="field"><label for="sHead">What happened</label><input class="input" id="sHead" maxlength="110" placeholder="A flag wipes out the game-sealing interception"></div>
  <div class="field"><label for="sWhy">Why it flipped the game</label><input class="input" id="sWhy" maxlength="200" placeholder="Denver got new downs and scored the winner"></div>
  <div class="field"><label for="sLink">Link to the clip or story</label><input class="input" id="sLink" placeholder="https://"></div>
  <div class="err" id="sErr"></div><button class="btn go full" id="sGo">Submit for review</button>
  <p class="note" style="text-align:center;margin:10px 0 0">Moments are checked before they go live. No rumors, no injuries played for laughs.</p></div>`);
  let cat=cats[0];$("#sCat").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;cat=b.dataset.v;[...$("#sCat").children].forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#sGo").onclick=()=>{const g=$("#sGame").value.trim(),hd=$("#sHead").value.trim();if(g.length<3||hd.length<8){$("#sErr").textContent="Add the game and a one-line description of what happened.";return}
    const parts=g.split(/\s+vs\.?\s+|\s+v\s+|\s+@\s+/i);const id="u_"+Date.now();
    const m={id,user:true,live:false,sport:$("#sSport").value,league:"Fan submitted",cat,play:{Flag:"flag",Sub:"sub",Argument:"clash",Technical:"clash","Missed call":"catch",Rule:"flag"}[cat]||"celebrate",pal:"gold",headline:hd,line:$("#sWhy").value.trim()||"Submitted by you.",game:{a:(parts[0]||g).slice(0,14),as:"",b:(parts[1]||"").slice(0,14),bs:"",res:"Fan submitted"},clock:$("#sClock").value.trim()||"In game",date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}),team:(parts[0]||"Team").slice(0,6),before:50,after:50,verdict:"Submitted by you",athletes:[],seed:[1,1,2,3,4,5,4,3,2,1,1],source:{name:$("#sLink").value.trim()?"Your link":"No link",url:$("#sLink").value.trim()||"#"}};
    S.submitted.push(m);save();closeModal();toast("Submitted","Your moment is under review. It goes live once it's checked.");
    setTimeout(()=>{m.live=true;save();toast("Your moment is live",`<b>${esc(hd)}</b> is in the feed for fans to call.`);island(`<span class="catpill c-flag" style="font-size:9px">LIVE</span>`,`Your flip`,3000);if(UI.view!=="feed")build()},9000);
  };
}
/* share card */
function drawShare(m,cb){
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  x.fillStyle="#0a0a0a";x.fillRect(0,0,W,H);const img=new Image();img.onload=()=>{
    x.save();x.globalAlpha=.55;const s=Math.max(W/img.width,760/img.height);x.drawImage(img,(W-img.width*s)/2,0,img.width*s,img.height*s);x.restore();
    const g=x.createLinearGradient(0,300,0,820);g.addColorStop(0,"rgba(8,9,12,0)");g.addColorStop(1,"rgba(8,9,12,1)");x.fillStyle=g;x.fillRect(0,0,W,H);
    x.fillStyle="#fff";x.font='800 76px "Bricolage Grotesque", sans-serif';x.fillText("flip",60,110);{const fw=x.measureText("flip").width;x.save();x.shadowColor="#f5c542";x.shadowBlur=28;x.fillStyle="#f5c542";x.beginPath();x.arc(60+fw+14,100,9,0,7);x.fill();x.restore()}
    x.font='700 30px "Geist Mono", monospace';x.fillStyle="#0a0a0a";const cat=m.cat.toUpperCase();const cw=x.measureText(cat).width+40;x.fillStyle="#f5c542";x.fillRect(W-60-cw,70,cw,52);x.fillStyle="#1a1300";x.fillText(cat,W-40-cw,108);
    x.fillStyle="#b0b0b0";x.font='600 30px "Geist Mono", monospace';x.fillText(`${m.league.toUpperCase()} · ${m.date.toUpperCase()}`,60,640);
    x.fillStyle="#fff";x.font='800 60px "Bricolage Grotesque", system-ui, sans-serif';let y=720,line="";for(const wd of m.headline.split(" ")){const t=line?line+" "+wd:wd;if(x.measureText(t).width>W-120){x.fillText(line,60,y);y+=70;line=wd}else line=t}x.fillText(line,60,y);
    y+=70;x.fillStyle="#141414";x.fillRect(60,y,W-120,200);x.fillStyle="#b0b0b0";x.font='600 28px Geist, sans-serif';x.fillText(`Est. ${m.team} win chance`,90,y+50);
    x.font='700 70px "Geist Mono", monospace';x.fillStyle="#fff";x.fillText(`${m.before}%`,90,y+140);x.fillStyle="#9a9a9a";x.fillText("→",300,y+140);x.fillStyle=swing(m)>=0?"#f5c542":"#ff5b4f";x.fillText(`${m.after}%`,400,y+140);
    x.textAlign="right";x.fillStyle="#f5c542";x.font='800 96px "Bricolage Grotesque", sans-serif';x.fillText(fanPct(m)+"%",W-90,y+130);x.font='600 26px Geist, sans-serif';x.fillStyle="#b0b0b0";x.fillText("of fans agree",W-90,y+170);x.textAlign="left";
    y+=260;const r=S.rated[m.id];x.fillStyle="#fff";x.font='700 40px Geist, sans-serif';x.fillText(r!=null?`My call: ${r>=6?"it flipped the game":"not really"}`:`Did it flip the game?`,60,y);
    x.fillStyle="#5f5f5f";x.font='500 26px Geist, sans-serif';x.fillText(`Rate it on Flip · source: ${m.source.name}`,60,H-60);cb(cv)};img.src=art(m,"wide");
}
function openShare(m){
  modal(`<div class="sheet"><div class="grab"></div><div class="sheethead"><h2>Share this flip</h2><button class="x" data-close aria-label="Close">✕</button></div><div id="shWrap" class="flexwrap"><div class="note" style="padding:40px;text-align:center">Rendering card…</div></div>
  <div class="two" style="margin-top:12px"><button class="btn go" id="shShare">Share card</button><button class="btn ghost" id="shSave">Save image</button></div><p class="note" style="text-align:center;margin:10px 0 0">If saving doesn't work on your device, take a screenshot.</p></div>`);
  drawShare(m,cv=>{const url=cv.toDataURL("image/png");$("#shWrap").innerHTML=`<img alt="Share card" src="${url}">`;const name=`flip-${m.id}.png`;
    $("#shSave").onclick=async()=>{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads").catch(()=>null);if(dl){try{await dl.save({filename:name,data:await (await fetch(url)).blob()});toast("Saved","Card saved. Post it.")}catch(e){if(e&&e.code!=="declined")toast("Save unavailable","Take a screenshot instead.","warn")}return}toast("Save unavailable","Take a screenshot instead.","warn");return}
      const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
    $("#shShare").onclick=async()=>{try{const f=new File([await (await fetch(url)).blob()],name,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:"Was this the moment the game flipped?"});else{await navigator.clipboard.writeText(`${m.headline}. ${fanPct(m)}% of fans say it flipped the game. Did it?`);toast("Copied","Caption copied. Save the image and post it.")}}catch(e){toast("Share unavailable","Save the image or screenshot instead.","warn")}}});
}
/* onboarding */
function onboard(){
  modal(`<div class="sheet"><div class="grab"></div><div class="obhero"><span class="brand2" style="font-size:44px"><b>flip</b></span><div class="eyebrow" style="margin-top:6px">Small moments. Big swings.</div></div>
  <div class="obsteps"><div><b>Swipe the turning points.</b><span>Missed calls, flags, subs, arguments: the niche moments that changed where a game was going.</span></div>
  <div><b>Make your call.</b><span>Did it flip the game? Tap yes or no, then see what % of fans agree and how much the win chance moved.</span></div>
  <div><b>Call swings live, pick the flip after.</b><span>During a game, tap the plays you think swung it, and say whether the big calls were right. When it ends, vote on which moment was the flip.</span></div>
  <div><b>Share the argument.</b><span>Every flip becomes a card built for the group chat, X and TikTok. Spot one we missed? Add it with +.</span></div></div>
  <button class="btn go full" id="obGo" style="margin-top:14px;padding:15px">Start swiping</button></div>`);
  $("#obGo").onclick=()=>{S.onboarded=true;save();closeModal()};
}
/* wiring */
$("#nav").onclick=e=>{const b=e.target.closest("[data-v]");if(b)setView(b.dataset.v)};
$("#launchBtn").onclick=openSubmit;
window.addEventListener("resize",()=>{scaleDevice();if(UI.view==="game")buildGame();if(UI.view==="final")drawFinal(curFinal());if(UI.view==="live")paintLive();if(UI.view==="real")drawReal(curReal())});
async function boot(){scaleDevice();try{await Promise.race([document.fonts.load('800 80px "Bricolage Grotesque"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  load();S.picks=S.picks||{};startLive();initRealData();setView("feed");if(!S.onboarded)setTimeout(onboard,400)}
boot();

})();
